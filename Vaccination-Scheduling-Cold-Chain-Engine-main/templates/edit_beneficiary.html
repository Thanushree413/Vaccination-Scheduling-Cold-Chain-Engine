{% extends "base.html" %}
{% block title %}Edit Beneficiary — VacciTrack{% endblock %}
{% block content %}

<div class="page-header">
  <h1>✏️ Edit Beneficiary</h1>
  <p class="subtitle">Update details for <strong>{{ b.name }}</strong></p>
</div>

<div class="card" style="max-width:680px">
  <form method="POST">
    <div class="form-row">
      <div class="form-group">
        <label>Beneficiary ID</label>
        <input class="form-control" value="{{ b.beneficiary_id }}" disabled/>
      </div>
      <div class="form-group">
        <label for="name">Full Name *</label>
        <input id="name" name="name" class="form-control" required value="{{ b.name }}"/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="date_of_birth">Date of Birth *</label>
        <input id="date_of_birth" name="date_of_birth" type="date" class="form-control"
               required value="{{ b.date_of_birth }}"/>
      </div>
      <div class="form-group">
        <label for="gender">Gender</label>
        <select id="gender" name="gender" class="form-control">
          <option value="">— Select —</option>
          {% for g in ['Male','Female','Other'] %}
            <option {% if b.gender==g %}selected{% endif %}>{{ g }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="guardian_name">Guardian / Parent Name</label>
        <input id="guardian_name" name="guardian_name" class="form-control" value="{{ b.guardian_name }}"/>
      </div>
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input id="phone" name="phone" class="form-control" value="{{ b.phone }}"/>
      </div>
    </div>
    <div class="form-group">
      <label for="address">Address</label>
      <input id="address" name="address" class="form-control" value="{{ b.address }}"/>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">💾 Save Changes</button>
      <a href="{{ url_for('beneficiaries') }}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
