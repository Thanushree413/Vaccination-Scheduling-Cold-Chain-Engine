{% extends "base.html" %}
{% block title %}Add Schedule — VacciTrack{% endblock %}
{% block content %}

<div class="page-header">
  <h1>➕ Add Schedule</h1>
  <p class="subtitle">Set a vaccination due date for a beneficiary</p>
</div>

<div class="card" style="max-width:600px">
  <form method="POST">
    <div class="form-group">
      <label for="beneficiary_id">Beneficiary *</label>
      <select id="beneficiary_id" name="beneficiary_id" class="form-control" required>
        <option value="">— Select beneficiary —</option>
        {% for b in beneficiaries %}
          <option value="{{ b.beneficiary_id }}">{{ b.beneficiary_id }} — {{ b.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="vaccine_name">Vaccine Name *</label>
        <input id="vaccine_name" name="vaccine_name" class="form-control" required placeholder="e.g. OPV"/>
      </div>
      <div class="form-group">
        <label for="dose_number">Dose Number *</label>
        <input id="dose_number" name="dose_number" type="number" min="1" class="form-control" required value="1"/>
      </div>
    </div>
    <div class="form-group">
      <label for="due_date">Due Date *</label>
      <input id="due_date" name="due_date" type="date" class="form-control" required/>
    </div>
    <div class="form-group">
      <label for="notes">Notes</label>
      <input id="notes" name="notes" class="form-control" placeholder="Optional notes"/>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">📅 Add Schedule</button>
      <a href="{{ url_for('schedules') }}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
