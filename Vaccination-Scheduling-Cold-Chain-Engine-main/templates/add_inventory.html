{% extends "base.html" %}
{% block title %}Add Inventory — VacciTrack{% endblock %}
{% block content %}

<div class="page-header">
  <h1>➕ Add Vaccine Stock</h1>
  <p class="subtitle">Add a new vaccine batch to inventory</p>
</div>

<div class="card" style="max-width:600px">
  <form method="POST">
    <div class="form-row">
      <div class="form-group">
        <label for="vaccine_name">Vaccine Name *</label>
        <input id="vaccine_name" name="vaccine_name" class="form-control" required placeholder="e.g. BCG"/>
      </div>
      <div class="form-group">
        <label for="batch_number">Batch Number *</label>
        <input id="batch_number" name="batch_number" class="form-control" required placeholder="e.g. BCG-2026-001"/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="quantity">Quantity (doses) *</label>
        <input id="quantity" name="quantity" type="number" min="1" class="form-control" required/>
      </div>
      <div class="form-group">
        <label for="expiry_date">Expiry Date *</label>
        <input id="expiry_date" name="expiry_date" type="date" class="form-control" required/>
      </div>
    </div>
    <div class="form-group">
      <label for="storage_temp">Storage Temperature (°C)</label>
      <input id="storage_temp" name="storage_temp" type="number" step="0.1" class="form-control" value="4.0"/>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">📦 Add to Inventory</button>
      <a href="{{ url_for('inventory') }}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
