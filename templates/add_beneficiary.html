{% extends "base.html" %}
{% block title %}Add Beneficiary — VacciTrack{% endblock %}
{% block content %}

<div class="page-header">
  <h1>➕ Add Beneficiary</h1>
  <p class="subtitle">Register a new vaccination beneficiary</p>
</div>

<div class="card" style="max-width:680px">
  <form method="POST">
    <div class="form-row">
      <div class="form-group">
        <label for="beneficiary_id">Beneficiary ID *</label>
        <input id="beneficiary_id" name="beneficiary_id" class="form-control" required placeholder="e.g. B001"/>
      </div>
      <div class="form-group">
        <label for="name">Full Name *</label>
        <input id="name" name="name" class="form-control" required placeholder="e.g. Anu Sharma"/>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="date_of_birth">Date of Birth *</label>
        <input id="date_of_birth" name="date_of_birth" type="date" class="form-control" required/>
      </div>
      <div class="form-group">
        <label for="gender">Gender</label>
        <select id="gender" name="gender" class="form-control">
          <option value="">— Select —</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="guardian_name">Guardian / Parent Name</label>
        <input id="guardian_name" name="guardian_name" class="form-control" placeholder="Guardian name"/>
      </div>
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input id="phone" name="phone" class="form-control" placeholder="+91 XXXXXXXXXX"/>
      </div>
    </div>
    <div class="form-group">
      <label for="address">Address</label>
      <input id="address" name="address" class="form-control" placeholder="Village / Town, District"/>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">✅ Register Beneficiary</button>
      <a href="{{ url_for('beneficiaries') }}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
